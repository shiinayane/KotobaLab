name: DictionaryBuilder tests

on:
  push:
    branches: [main]
    paths:
      - 'Tools/DictionaryBuilder/**'
      - '.github/workflows/builder-tests.yml'
  pull_request:
    paths:
      - 'Tools/DictionaryBuilder/**'
      - '.github/workflows/builder-tests.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tools/DictionaryBuilder
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install pytest
        run: python -m pip install 'pytest>=9.0.3'

      - name: Run pytest
        run: python -m pytest
